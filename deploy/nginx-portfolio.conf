# ==============================================================================
# Configurazione Nginx per davide-ferraro.it (Debian 12 on-premise)
# Ottimizzata per zero-usura memoria eMMC (Intel Atom Z3775, 2GB RAM)
# ==============================================================================

# Reindirizzamento da HTTP (porta 80) a HTTPS (porta 443)
server {
    listen 80;
    listen [::]:80;
    server_name davide-ferraro.it www.davide-ferraro.it;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Server HTTPS principale (porta 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name davide-ferraro.it www.davide-ferraro.it;

    # Certificati SSL (Let's Encrypt o custom)
    ssl_certificate /etc/letsencrypt/live/davide-ferraro.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/davide-ferraro.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Header di sicurezza
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Root del frontend Next.js (file statici esportati in out/)
    root /var/www/portfolio;
    index index.html;

    # Compressione Gzip per servire file statici velocemente
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ==============================================================================
    # Reverse Proxy per Microservizio Backend Go (Docker Scratch su porta 3001)
    # ZERO-USURA eMMC: Buffer forzato in RAM per evitare scritture su disco
    # ==============================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:3001;

        # Protezione eMMC: forza Nginx a bufferizzare la richiesta esclusivamente in RAM
        # impedendo la creazione di file di spool temporanei in /var/lib/nginx/body
        client_max_body_size 32k;
        client_body_buffer_size 32k;

        # Parametri proxy HTTP standard
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout allineati ai limiti SMTP del backend (due invii da 10s max)
        proxy_connect_timeout 5s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;

        # Disabilita buffering proxy su disco per le risposte dell'API
        proxy_buffering off;
    }

    # Cache ottimizzata per gli asset statici versionati di Next.js (_next/static/)
    location /_next/static/ {
        alias /var/www/portfolio/_next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Immagini, icone e asset statici pubblici
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Pagine di errore statiche generate da Next.js
    error_page 404 /404.html;
    error_page 403 =404 /404.html;

    # Rotta in lavorazione, bloccata dal proxy Next.js in fase di sviluppo
    location ^~ /alzati-lazzaro-world {
        return 404;
    }

    # Gestione pagine statiche Next.js (routing App Router esportato)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
